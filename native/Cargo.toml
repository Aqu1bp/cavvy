[package]
name = "cavvy-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cavvy's native helper: Git object reads for turn snapshots, one process shared by every session"

[[bin]]
name = "cavvy-native"
path = "src/main.rs"

[dependencies]
gix-odb = { version = "0.87", features = ["sha1", "sha256"] }
gix-hash = { version = "0.28", features = ["sha1", "sha256"] }
gix-object = "0.66"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
