name: CI

on:
  pull_request:
    # Drafts don't run (see `if:` below); marking one ready does.
    types: [opened, synchronize, reopened, ready_for_review]
  # Every branch: a branch that gathers work before a pull request (an integration branch) is checked as it goes,
  # not only once it's proposed.
  push:
    branches: ["**"]
  workflow_dispatch:

# A newer push to a pull request or a branch cancels the run it replaces. Runs on main each have their own commit, so
# they all finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  CAVVY_NO_KEYCHAIN: "1"

jobs:
  checks:
    name: Typecheck and GUI build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge and the base it merges into: the budgets below compare the two.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: gui
      # The desktop app's types only: no Electron download, no native module builds (they're macOS's).
      - run: bun install --frozen-lockfile --ignore-scripts
        working-directory: desktop-electron
      - run: bun run typecheck
      - run: bun run gui:typecheck
      - run: bun run desktop:typecheck
      - run: bun run gui:build
      - run: bun run perf:budgets
      # The home screen left alone: its memory and CPU (scripts/perf-idle.ts), in installed Chrome.
      - run: bun run perf:idle
      # Adding the label takes effect on the next push.
      - name: Performance budgets only come down
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'perf-budget-raise')
        run: |
          git show HEAD^1:test/perf-budgets.json > "$RUNNER_TEMP/base-budgets.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-budgets.json"
          bun scripts/perf-budgets.ts ratchet "$RUNNER_TEMP/base-budgets.json"

  test:
    name: Tests (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # From its release on GitHub, checked against the hash below: the runners can't always reach Ubuntu's package
      # mirror, and every shard then failed here before a test ran. apt is the fallback.
      - name: Install ripgrep
        env:
          RG_VERSION: 14.1.0
          RG_SHA256: f84757b07f425fe5cf11d87df6644691c644a5cd2348a2c670894272999d3ba7
        run: |
          from_release() {
            local name="ripgrep-$RG_VERSION-x86_64-unknown-linux-musl"
            curl -fsSL --retry 3 --max-time 60 -o "$RUNNER_TEMP/rg.tar.gz" "https://github.com/BurntSushi/ripgrep/releases/download/$RG_VERSION/$name.tar.gz" &&
              echo "$RG_SHA256  $RUNNER_TEMP/rg.tar.gz" | sha256sum -c - &&
              tar -xzf "$RUNNER_TEMP/rg.tar.gz" -C "$RUNNER_TEMP" "$name/rg" &&
              sudo install -m 755 "$RUNNER_TEMP/$name/rg" /usr/local/bin/rg
          }
          from_release || { sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep; }
          rg --version
      - name: Set a git identity for tests that commit
        run: git config --global user.name "Cavvy CI" && git config --global user.email "ci@cavvy.invalid"
      # sandbox-differential.test.ts compares against origin/main, which a shallow checkout doesn't have.
      - name: Fetch origin/main
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: gui
      # A browser's first start on a runner reads it from disk: 1 to 35 s measured here, and up to 60 s inside a test
      # with the disk busy, which failed whichever test started one first. Read here, before any test's clock runs.
      - name: Start each browser once
        run: |
          for browser in /usr/bin/google-chrome /usr/bin/chromium; do
            [ -x "$browser" ] || continue
            start=$(date +%s%N)
            timeout --kill-after=5 180 "$browser" --headless --no-sandbox --dump-dom about:blank > /dev/null 2>&1 || echo "$browser didn't start"
            echo "$browser: $(( ($(date +%s%N) - start) / 1000000 )) ms"
          done
      - name: Run this shard's test files
        run: bun scripts/test-shard.ts ${{ matrix.shard }} 4 --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml
      # Feeds `bun scripts/test-shard.ts --timings`, which rebalances the shards.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.shard }}
          path: junit-${{ matrix.shard }}.xml
          retention-days: 14

  windows:
    name: Windows
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Compile cavvy.exe for Windows x64
        shell: pwsh
        run: |
          bun build --compile --minify --sourcemap=none --bytecode --target=bun-windows-x64-v${{ env.BUN_VERSION }} --define 'CAVVY_BUILD_ID="0123456789ab"' --no-compile-autoload-dotenv --no-compile-autoload-bunfig --outfile "$env:RUNNER_TEMP\cavvy.exe" src/index.ts src/agent/stat-worker.ts src/ui/mention-worker.ts
          $ver = & "$env:RUNNER_TEMP\cavvy.exe" host version
          Write-Host "version: $ver"
          if ($LASTEXITCODE -ne 0 -or $ver -notmatch '"build":"0123456789ab"') { exit 1 }
      - name: Run Windows core and server tests
        env:
          CAVVY_WIN_TEST_EXE: ${{ runner.temp }}\cavvy.exe
        run: bun test ./test/windows-core.test.ts ./test/servers-windows.test.ts

  # The one check to require before merging: it passes only when every job
  # above passed, however the matrix changes.
  ci:
    name: ci
    # Skipped with the rest for a draft (which can't be merged anyway).
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: [checks, test, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
