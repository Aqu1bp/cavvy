name: Release

# A tag v<version> publishes that commit's builds for servers, signed with the release key: what a Cavvy without a
# checkout downloads to put on a server (src/servers/published.ts, docs/releasing.md).
#
# Three jobs, so that the key and the right to publish are never where other people's code runs:
#   build     makes the bundles. It installs and runs the GUI's build tools: no secret, read-only.
#   sign      signs their descriptions. It installs nothing and runs one script on Node. The key is a secret of the
#             `release` environment, which only v* tags may use and which asks a reviewer first (repository settings).
#   publish   puts the files on the release. It has the right to, and no key.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.4
  CAVVY_NO_KEYCHAIN: "1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: gui
      - run: bun scripts/release-server-builds.ts "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-builds
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      # All of main's history too: the tagged commit has to be one of main's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-builds
          path: ${{ runner.temp }}/release
      - name: Sign
        env:
          CAVVY_RELEASE_SIGNING_KEY: ${{ secrets.CAVVY_RELEASE_SIGNING_KEY }}
        run: node scripts/sign-release.mjs "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-builds-signed
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # To make the release and put its files on it.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-builds-signed
          path: ${{ runner.temp }}/release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "" --verify-tag
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --clobber
